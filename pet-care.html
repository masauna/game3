<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>몽실이 돌봄</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{--ink:#5b3a4a;--card:rgba(255,255,255,.85)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#ffe4d2;font-family:'Jua','Malgun Gothic',sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
  canvas{position:fixed;inset:0;display:block;touch-action:none}
  #hud{position:fixed;left:0;right:0;top:0;padding:10px 12px;pointer-events:none;display:flex;flex-direction:column;gap:8px;max-width:640px;margin:0 auto}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pill{pointer-events:auto;text-decoration:none;color:var(--ink);background:var(--card);padding:6px 12px;border-radius:999px;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.08);border:0;font-family:inherit;cursor:pointer}
  #title{font-size:20px;background:var(--card);padding:4px 14px;border-radius:999px;white-space:nowrap}
  .chip{font-size:13px;background:#ff8fb1;color:#fff;padding:2px 8px;border-radius:999px;vertical-align:middle}
  #bars{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;background:var(--card);padding:8px 12px;border-radius:16px}
  .bar{display:flex;align-items:center;gap:6px;font-size:13px}
  .bar .ic{font-size:18px;width:22px;text-align:center;display:inline-block}
  .bar .lb{width:44px}
  .track{flex:1;height:12px;background:rgba(0,0,0,.08);border-radius:99px;overflow:hidden}
  .fill{height:100%;width:50%;border-radius:99px;transition:width .4s}
  .bar.low .ic{animation:shake .5s infinite}
  .bar.low .fill{animation:blink 1s infinite}
  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-18deg)}75%{transform:rotate(18deg)}}
  @keyframes blink{50%{opacity:.4}}
  #tools{position:fixed;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:8px;padding:0 10px;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
  #tools.away{transform:translateY(140%)}
  #tools button{font-family:inherit;border:0;background:#fff;border-radius:18px;padding:8px 8px 6px;min-width:60px;font-size:14px;color:var(--ink);box-shadow:0 4px 0 #e9b9a6;cursor:pointer;transition:transform .15s}
  #tools button b{display:block;font-size:24px;line-height:1.15;font-weight:normal}
  #tools button:hover{transform:translateY(-3px)}
  #tools button:active{transform:translateY(2px) scale(.95);box-shadow:0 1px 0 #e9b9a6}
  #tools button.on{background:#ff8fb1;color:#fff;box-shadow:0 4px 0 #d9668a}
  #tools button.gone{display:none}
  #tools button.alert{animation:wiggle .8s infinite}
  @keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(0)}}
  #tray{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);display:flex;gap:12px;background:var(--card);padding:8px 14px;border-radius:20px;transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .2s;box-shadow:0 6px 20px rgba(120,60,80,.15)}
  #tray.off{transform:translateX(-50%) translateY(30px) scale(.6);opacity:0;pointer-events:none}
  .food{font-size:34px;cursor:grab;touch-action:none;transition:transform .15s;text-align:center;line-height:1}
  .food:hover{transform:scale(1.2) rotate(-8deg)}
  .food small{display:block;font-size:11px;margin-top:2px}
  #hint{position:fixed;left:0;right:0;bottom:84px;text-align:center;font-size:14px;color:#9a6b7c;pointer-events:none;transition:opacity .4s}
  #toasts{position:fixed;top:36%;left:0;right:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;gap:6px;padding:0 12px}
  .toast{background:#fff;padding:10px 18px;border-radius:999px;font-size:19px;box-shadow:0 6px 20px rgba(120,60,80,.2);animation:pop 2.8s forwards;text-align:center}
  @keyframes pop{0%{transform:scale(0) rotate(-8deg);opacity:0}12%{transform:scale(1.15) rotate(2deg);opacity:1}20%{transform:scale(1) rotate(0)}85%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="row">
    <a class="pill" href="index.html">← 게임 목록</a>
    <div id="title"><span id="pname">몽실이</span> <span id="stage" class="chip">알</span></div>
    <button class="pill" id="reset" title="새로 키우기">⟳</button>
  </div>
  <div id="bars">
    <div class="bar" data-k="hunger"><span class="ic">🍙</span><span class="lb">포만감</span><div class="track"><div class="fill" style="background:#ffa94d"></div></div></div>
    <div class="bar" data-k="happy"><span class="ic">💖</span><span class="lb">행복</span><div class="track"><div class="fill" style="background:#ff7aa8"></div></div></div>
    <div class="bar" data-k="clean"><span class="ic">🫧</span><span class="lb">청결</span><div class="track"><div class="fill" style="background:#5cc8ff"></div></div></div>
    <div class="bar" data-k="energy"><span class="ic">⚡</span><span class="lb">기운</span><div class="track"><div class="fill" style="background:#ffd43b"></div></div></div>
  </div>
</div>
<div id="tray" class="off"></div>
<div id="hint"></div>
<div id="tools">
  <button data-t="feed"><b>🍙</b>밥</button>
  <button data-t="wash"><b>🧽</b>씻기</button>
  <button data-t="sleep"><b id="sleepIc">💡</b><span id="sleepLb">재우기</span></button>
  <button data-t="play"><b>⭐</b>놀기</button>
  <button data-t="med" id="medBtn" class="gone alert"><b>💊</b>약</button>
</div>
<div id="toasts"></div>
<script>
'use strict';
const TAU = Math.PI * 2, rand = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const outBack = t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const FONT = '"Jua","Malgun Gothic",sans-serif', EMOJI = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const $ = s => document.querySelector(s);

// ---------- 사운드 ----------
let AC = null, master = null;
function initAudio() { if (AC) { if (AC.state === 'suspended') AC.resume(); return; } try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.3; master.connect(AC.destination); } catch (e) { AC = null; } }
function tone(f, d, type = 'sine', v = 0.2, slide = 0, delay = 0) {
  if (!AC) return; const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain(); o.type = type;
  o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.02);
}
const sfx = {
  pop() { tone(660, 0.12, 'sine', 0.2, 1.8); },
  giggle() { tone(900, 0.07, 'triangle', 0.15, 1.3); tone(1100, 0.08, 'triangle', 0.15, 1.3, 0.09); },
  eat() { for (let i = 0; i < 3; i++) tone(220 + i * 30, 0.06, 'square', 0.08, 0.6, i * 0.18); },
  bubble() { tone(rand(700, 1300), 0.08, 'sine', 0.1, 1.6); },
  tap() { tone(520, 0.06, 'triangle', 0.15, 0.7); },
  good() { [523, 659, 784].forEach((f, i) => tone(f, 0.15, 'triangle', 0.15, 0, i * 0.08)); },
  bad() { tone(300, 0.25, 'sawtooth', 0.08, 0.6); },
  fanfare() { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, 0.22, 'triangle', 0.17, 0, i * 0.12)); },
  star() { tone(1200 + Math.random() * 400, 0.1, 'sine', 0.12, 1.5); },
};

// ---------- 캔버스 ----------
const cv = $('#c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() { if (!innerWidth || !innerHeight) return; DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cv.style.width = W + 'px'; cv.style.height = H + 'px'; }
addEventListener('resize', resize); resize();

// ---------- 데이터 ----------
const STAGES = ['알', '아기', '어린이', '어른'];
const FORMS = { angel: { name: '천사 몽실', col: '#fff3fa', dark: '#cfa9e6' }, star: { name: '별빛 몽실', col: '#ffe27a', dark: '#dba23a' }, imp: { name: '장난꾸러기 몽실', col: '#c9a8ff', dark: '#8a63d2' } };
const STAGE_COL = [null, { col: '#ffc8dc', dark: '#e48aa9' }, { col: '#ffd4a8', dark: '#e39a5b' }];
const FOODS = [{ e: '🍙', n: '주먹밥', hu: 24, ha: 2 }, { e: '🍎', n: '사과', hu: 14, ha: 4 }, { e: '🍰', n: '케이크', hu: 12, ha: 14, poop: 30 }, { e: '🥛', n: '우유', hu: 10, ha: 3, en: 8 }];
const DIRT = [[-0.5, 0.1, 0.13, 0.3], [0.45, 0.3, 0.1, 1], [0.1, -0.5, 0.09, 2], [-0.2, 0.55, 0.12, 0.5], [0.6, -0.2, 0.08, 0]];
const CRACKS = []; for (let i = 0; i < 8; i++) { const a = -Math.PI / 2 + (i - 3.5) * 0.32, pts = []; let x = Math.cos(a) * 0.55, y = Math.sin(a) * 0.55 - 0.1; for (let k = 0; k < 4; k++) { pts.push([x, y]); x += rand(-0.12, 0.12); y += 0.12; } CRACKS.push(pts); }

const DEF = { stage: 0, form: '', age: 0, care: 0, cracks: 0, hunger: 70, happy: 75, clean: 90, energy: 85, poops: [], sick: false, asleep: false, last: Date.now(), poopT: 90 };
function fresh() { return JSON.parse(JSON.stringify(Object.assign({}, DEF, { last: Date.now() }))); }
function load() { try { const s = JSON.parse(localStorage.getItem('pets_care')); if (s && typeof s.stage === 'number') return Object.assign(fresh(), s); } catch (e) { } return fresh(); }
function save() { S.last = Date.now(); try { localStorage.setItem('pets_care', JSON.stringify(S)); } catch (e) { } }
let S = load();

const pet = { jy: 0, jv: 0, sq: 0, blinkT: 0, blinkWait: 3, eat: 0, eatFood: null, joy: 0, eggWob: 0, look: { x: 0, y: 0 } };
const G = { t: 0, mode: 'normal', tool: null, evo: null, say: null, sayWait: 4, flash: 0, night: S.asleep ? 1 : 0, drag: null, rub: null, washing: false, play: null, ptr: { x: -999, y: -999 }, saveT: 0, zzzT: 0 };
let parts = [];
const clouds = [0, 1, 2].map(i => ({ x: Math.random(), y: 0.2 + i * 0.25, s: rand(0.6, 1), sp: rand(0.01, 0.025) }));

const avg = () => (S.hunger + S.happy + S.clean + S.energy) / 4;
function petPos() {
  if (G.mode === 'play') return { x: G.play.px, y: H * 0.8, R: Math.min(W, H) * 0.08 };
  const sc = [0.72, 0.62, 0.82, 1][S.stage];
  return { x: W / 2, y: H * 0.61, R: Math.min(W * 0.21, H * 0.14) * 1.25 * sc };
}

// ---------- 유틸 ----------
function toast(msg) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; $('#toasts').appendChild(d); setTimeout(() => d.remove(), 2900); }
function say(txt, dur = 2.6) { G.say = { txt, t: 0, dur }; G.sayWait = rand(8, 12); }
function addP(o) { if (parts.length < 500) parts.push(Object.assign({ vx: 0, vy: 0, life: 1, max: 1, rot: 0, vr: 0, g: 0, size: 22 }, o)); }
function hearts(x, y, n = 1) { for (let i = 0; i < n; i++) addP({ k: 'txt', txt: Math.random() < 0.8 ? '💖' : '💕', x: x + rand(-20, 20), y, vx: rand(-50, 50), vy: rand(-140, -80), life: 1.1, max: 1.1, size: rand(20, 30), vr: rand(-1, 1) }); }
function sparkle(x, y, n, col = '#ffd43b', sp = 200) { for (let i = 0; i < n; i++) { const a = Math.random() * TAU, v = rand(0.3, 1) * sp; addP({ k: 'star', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.5, 1), max: 1, size: rand(5, 11), col, vr: rand(-6, 6), drag: 0.93 }); } }
function confetti(n) { const cols = ['#ff7aa8', '#ffd43b', '#5cc8ff', '#8ce99a', '#b197fc']; for (let i = 0; i < n; i++) addP({ k: 'conf', x: rand(0, W), y: rand(-80, -10), vx: rand(-60, 60), vy: rand(80, 220), life: rand(2, 3.2), max: 3.2, size: rand(6, 11), col: cols[i % 5], rot: rand(0, TAU), vr: rand(-8, 8) }); }
function ring(x, y, r, col) { addP({ k: 'ring', x, y, life: 0.6, max: 0.6, size: r, col }); }
function jump(power = 520) { if (pet.jy > -1) pet.jv = -power; }
function fmtTime(s) { if (s < 3600) return Math.round(s / 60) + '분'; return Math.floor(s / 3600) + '시간 ' + Math.round((s % 3600) / 60) + '분'; }
function addPoop() { if (S.poops.length >= 4) return; S.poops.push({ fx: clamp(0.5 + (Math.random() < 0.5 ? -1 : 1) * rand(0.18, 0.36), 0.08, 0.92), fy: rand(0.74, 0.8) }); }

// ---------- 시간 경과 ----------
function tick(dt) {
  S.age += dt;
  if (S.stage === 0) { if (S.age >= 25) evolve(); return; }
  const z = S.asleep;
  S.hunger -= 0.11 * dt * (z ? 0.35 : 1);
  S.happy -= 0.07 * dt * (z ? 0.2 : 1) + (S.sick ? 0.05 * dt : 0);
  S.clean -= (0.04 + S.poops.length * 0.05) * dt;
  S.energy += z ? 0.6 * dt : -0.055 * dt;
  for (const k of ['hunger', 'happy', 'clean', 'energy']) S[k] = clamp(S[k], 0, 100);
  if (avg() >= 60) S.care += dt;
  if (!S.sick && avg() < 22) { S.sick = true; say('몸이 안 좋아요… 🤒'); }
  if (!z) { S.poopT -= dt; if (S.poopT <= 0) { S.poopT = rand(80, 140); addPoop(); sfx.pop(); say('응가 했어요… 😳'); } }
  if (z && S.energy >= 100) { S.asleep = false; say('잘 잤다! ☀️'); updateSleepBtn(); sfx.good(); }
  if ((S.stage === 1 && S.age >= 240) || (S.stage === 2 && S.age >= 720)) evolve();
}
(function offline() {
  const el = clamp((Date.now() - S.last) / 1000, 0, 8 * 3600); if (el < 30) return;
  S.age += el;
  if (S.stage > 0) {
    S.hunger -= 0.055 * el; S.happy -= 0.035 * el; S.clean -= 0.02 * el;
    S.energy += S.asleep ? 0.6 * el : -0.027 * el;
    for (let i = 0; i < Math.min(3, Math.floor(el / 300)); i++) addPoop();
    for (const k of ['hunger', 'happy', 'clean', 'energy']) S[k] = clamp(S[k], 5, 100);
    if (S.asleep && S.energy >= 100) S.asleep = false;
  }
  setTimeout(() => toast(`자리를 비운 동안 ${fmtTime(el)}이 지났어요`), 700);
})();

function decideForm() { const r = S.care / Math.max(1, S.age); return r > 0.6 ? 'angel' : r > 0.3 ? 'star' : 'imp'; }
function evolve() { if (G.evo || S.stage >= 3) return; G.evo = { t: 0, done: false }; [392, 440, 494, 523, 587, 659].forEach((f, i) => tone(f, 0.25, 'sine', 0.1, 0, i * 0.28)); closeTray(); }

// ---------- 행동 ----------
const tray = $('#tray');
FOODS.forEach((f, i) => { const d = document.createElement('div'); d.className = 'food'; d.innerHTML = `${f.e}<small>${f.n}</small>`; d.dataset.i = i; tray.appendChild(d); });
function closeTray() { tray.classList.add('off'); document.querySelector('[data-t=feed]').classList.remove('on'); }
function setHint(t) { $('#hint').textContent = t; $('#hint').style.opacity = t ? 1 : 0; }
function updateSleepBtn() { $('#sleepIc').textContent = S.asleep ? '☀️' : '💡'; $('#sleepLb').textContent = S.asleep ? '깨우기' : '재우기'; }
updateSleepBtn();
function busy() { if (S.stage === 0) { say('아직 알이에요! 톡톡 두드려 볼까요?'); jumpEgg(); return true; } if (G.evo) return true; return false; }
function jumpEgg() { pet.eggWob = 1; }

document.querySelectorAll('#tools button').forEach(b => b.addEventListener('click', () => {
  initAudio(); const t = b.dataset.t; sfx.tap();
  if (t === 'feed') {
    if (busy()) return; if (S.asleep) { say('쿨쿨… 💤'); return; }
    const open = tray.classList.toggle('off') === false; b.classList.toggle('on', open);
    if (open) { setTool(null); setHint('음식을 몽실이 입으로 끌어다 주세요'); } else setHint('');
  } else if (t === 'wash') {
    if (busy()) return; closeTray(); setTool(G.tool === 'wash' ? null : 'wash');
  } else if (t === 'sleep') {
    if (busy()) return; closeTray(); setTool(null);
    S.asleep = !S.asleep; updateSleepBtn();
    if (S.asleep) { say('잘 자요… 💤'); tone(400, 0.4, 'sine', 0.12, 0.6); } else { say(S.energy < 60 ? '으으… 더 자고 싶은데 😪' : '좋은 아침! ☀️'); sfx.good(); }
  } else if (t === 'play') {
    if (busy()) return; closeTray(); setTool(null);
    if (S.asleep) { say('자는 중이에요… 💤'); return; }
    if (S.energy < 15) { say('너무 졸려요… 😪'); return; }
    startPlay();
  } else if (t === 'med') {
    if (!S.sick) return; S.sick = false; S.happy = clamp(S.happy - 4, 0, 100);
    S.hunger = Math.max(S.hunger, 30); S.clean = Math.max(S.clean, 30); S.energy = Math.max(S.energy, 30); S.happy = Math.max(S.happy, 30);
    const p = petPos(); sparkle(p.x, p.y, 30, '#8ce99a', 260); ring(p.x, p.y, p.R * 2, '#8ce99a'); say('쓰읍… 써요! 그래도 나았어요 😊'); sfx.good();
  }
}));
function setTool(t) { G.tool = t; document.querySelector('[data-t=wash]').classList.toggle('on', t === 'wash'); setHint(t === 'wash' ? '몽실이를 문질러 씻겨 주세요 🫧' : ''); }
$('#reset').addEventListener('click', () => { if (confirm('처음부터 새로 키울까요? 지금 몽실이와는 작별해요.')) { S = fresh(); parts = []; G.evo = null; G.night = 0; updateSleepBtn(); save(); toast('새로운 알이 도착했어요! 🥚'); } });

function eat(f) {
  pet.eat = 1.4; pet.eatFood = f; closeTray(); setHint('');
  S.hunger = clamp(S.hunger + f.hu, 0, 100); S.happy = clamp(S.happy + f.ha, 0, 100); if (f.en) S.energy = clamp(S.energy + f.en, 0, 100);
  if (f.poop) S.poopT = Math.max(5, S.poopT - f.poop);
  sfx.eat(); const p = petPos(); addP({ k: 'txt', txt: '+포만감', font: FONT, col: '#e8590c', x: p.x, y: p.y - p.R * 1.1, vy: -60, life: 1.2, max: 1.2, size: 22 });
  setTimeout(() => say(S.hunger > 95 ? '배불러요~ 😋' : pick(['냠냠! 맛있어요 😋', '최고의 맛이에요!', '더 주세요~'])), 700);
}
const pick = a => a[(Math.random() * a.length) | 0];

// 미니게임
function startPlay() { G.mode = 'play'; G.play = { t: 20, score: 0, items: [], spawn: 0.4, px: W / 2, tx: W / 2, shake: 0 }; $('#tools').classList.add('away'); setHint(''); say('별을 받아요! 돌은 피해요!', 2); }
function endPlay() {
  const s = G.play.score; G.mode = 'normal'; G.play = null; $('#tools').classList.remove('away');
  S.happy = clamp(S.happy + Math.min(40, 8 + s * 2), 0, 100); S.energy = clamp(S.energy - 12, 0, 100); S.hunger = clamp(S.hunger - 8, 0, 100);
  toast(`⭐ ${s}개 획득! 행복 +${Math.min(40, 8 + s * 2)}`); sfx.fanfare(); pet.joy = 1.5; jump(600); confetti(40);
}

// ---------- 입력 ----------
function onPet(x, y) { const p = petPos(); return Math.hypot(x - p.x, (y - p.y) * 1.1) < p.R * 1.05; }
cv.addEventListener('pointerdown', e => {
  initAudio(); const x = e.clientX, y = e.clientY; G.ptr = { x, y };
  if (G.mode === 'play') { G.play.tx = x; return; }
  for (let i = S.poops.length - 1; i >= 0; i--) {
    const pp = S.poops[i], px = pp.fx * W, py = pp.fy * H;
    if (Math.hypot(x - px, y - py) < 34) { S.poops.splice(i, 1); sparkle(px, py, 14, '#ffffff', 160); for (let k = 0; k < 6; k++) addP({ k: 'bubble', x: px + rand(-15, 15), y: py, vx: rand(-30, 30), vy: rand(-90, -40), life: 1, max: 1, size: rand(5, 10) }); S.clean = clamp(S.clean + 6, 0, 100); S.happy = clamp(S.happy + 2, 0, 100); sfx.bubble(); say('개운해요! ✨'); return; }
  }
  if (G.evo) return;
